<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Saltana — The meaning of real joy.</title>
  <meta name="description" content="Saltana is a live voice chat app. The meaning of real joy.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/chrome.css?v=4">
  <link rel="stylesheet" href="styles.css?v=64">
  <link rel="preload" as="image" href="assets/logo.webp?v=1" fetchpriority="high">
  <link rel="preload" as="image" href="assets/cloud-band.webp?v=1" fetchpriority="high">
  <link rel="preload" as="image" href="assets/live/phone.webp?v=1">
  <script>
    (function () {
      if (localStorage.getItem("saltana-lang") === "ar") {
        document.documentElement.lang = "ar";
        document.documentElement.dir = "rtl";
      }
    })();
  </script>
</head>
<body data-page="home" data-title="title_home">
  <div class="page">
    <div class="sky" aria-hidden="true">
      <div class="glow glow-phone"></div>
      <div class="glow glow-gold"></div>
      <div class="stars"></div>
      <img class="spark a" src="assets/spark.webp?v=1" alt="">
      <img class="spark b" src="assets/spark-c.webp?v=1" alt="">
      <img class="spark c" src="assets/spark-sm.webp?v=1" alt="">
      <img class="spark d" src="assets/spark-d.webp?v=1" alt="">
      <div class="cloud-band">
        <img src="assets/cloud-band.webp?v=1" alt="" fetchpriority="high">
      </div>
    </div>

    <header class="topbar">
      <nav class="menu">
        <a href="index.html" data-nav="home" data-i18n="nav_home">Home</a>
        <a href="privacy.html" data-nav="privacy" data-i18n="nav_privacy">Privacy</a>
        <a href="terms.html" data-nav="terms" data-i18n="nav_terms">Terms</a>
        <div class="langs" role="group" aria-label="Language">
          <button type="button" data-set-lang="en">EN</button>
          <button type="button" data-set-lang="ar">عربي</button>
        </div>
      </nav>
    </header>

    <main>
      <section class="brand">
        <img class="logo" src="assets/logo.webp?v=1" alt="Saltana" data-i18n-alt="alt_logo" fetchpriority="high">
        <h1 data-i18n-html="hero_title">The meaning<br><em>of real joy.</em></h1>
        <p data-i18n-html="hero_sub">Music, ease,<br>and pure harmony.</p>
        <div class="stores">
          <button type="button">
            <img src="assets/app-store.webp?v=1" alt="Download on the App Store" data-i18n-alt="alt_apple">
          </button>
          <button type="button">
            <img src="assets/google-play.webp?v=1" alt="Get it on Google Play" data-i18n-alt="alt_play">
          </button>
        </div>
      </section>
      <div class="stage">
      <div class="devices">
        <div class="phone">
          <img class="bezel" src="assets/live/phone.webp?v=1" alt="Saltana voice room on a phone" data-i18n-alt="alt_phone">
          <div class="screen" aria-hidden="true">
            <div class="hud">
              <img src="assets/live/speaker.webp?v=1" alt="">
              <img src="assets/live/menu.webp?v=1" alt="">
            </div>
            <div class="room"><b>Chill Vibes</b><span>8 people</span></div>
            <img class="seat s1" src="assets/live/ava2.webp?v=1" alt="">
            <img class="seat s2" src="assets/live/ava3.webp?v=1" alt="">
            <img class="seat s3" src="assets/live/ava3.webp?v=1" alt="">
            <img class="seat s4" src="assets/live/ava2.webp?v=1" alt="">
            <span class="eq left">
              <i></i><i></i><i></i><i></i><i></i>
            </span>
            <span class="eq right">
              <i></i><i></i><i></i><i></i>
            </span>
            <div class="hero">
              <i></i>
              <img src="assets/live/ava1.webp?v=1" alt="">
            </div>
            <div class="dock">
              <img src="assets/live/people.webp?v=1" alt="">
              <div class="mic">
                <i></i>
                <i></i>
                <img src="assets/live/mic.webp?v=1" alt="">
              </div>
              <span class="more"><i></i><i></i><i></i></span>
            </div>
          </div>
        </div>
      </div>
      </div>
    </main>
  </div>
  <script src="js/i18n.js?v=6"></script>
</body>
</html>
