<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Saltana — Real People. Real Voices.</title>
  <meta name="description" content="Saltana is a live voice chat app. Meaningful conversations, anytime, anywhere.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="page">
    <div class="sky" aria-hidden="true">
      <div class="glow glow-left"></div>
      <div class="glow glow-right"></div>
      <img class="deco clouds-low" src="assets/clouds-low.png" alt="">
      <img class="deco clouds" src="assets/clouds.png" alt="">
      <img class="deco wave wave-1" src="assets/wave-1.png" alt="">
      <img class="deco wave wave-2" src="assets/wave-2.png" alt="">
      <img class="deco spark s1" src="assets/spark.png" alt="">
      <img class="deco spark s2" src="assets/spark.png" alt="">
      <img class="deco spark s3" src="assets/spark-sm.png" alt="">
    </div>

    <header>
      <img class="logo" src="assets/logo.png" alt="Saltana">
      <nav>
        <a href="privacy.html">Privacy</a>
        <a href="terms.html">Terms</a>
      </nav>
    </header>

    <main>
      <div class="copy">
        <h1>Real People.<br><em>Real Voices.</em></h1>
        <p class="sub">Meaningful Conversations.<br>Anytime, Anywhere.</p>
        <div class="stores">
          <a href="https://apps.apple.com/app/saltana">
            <img src="assets/app-store.png" alt="Download on the App Store">
          </a>
          <a href="https://play.google.com/store/apps/details?id=com.saltana.app">
            <img src="assets/google-play.png" alt="Get it on Google Play">
          </a>
        </div>
      </div>
      <div class="phone-wrap">
        <img class="phone" src="assets/phone.png" alt="Saltana voice room">
      </div>
    </main>
  </div>
</body>
</html>
